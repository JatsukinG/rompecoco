<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Rompecoco · Juegos para romperte el coco</title>
    <meta
      name="description"
      content="Juegos de ingenio en español: adivina la palabra del día, une letras en Hilos y más. Partidas cortas, un reto nuevo cada día y gratis."
    />
    <link rel="canonical" href="%VITE_SITE_URL%/" />
    <meta name="theme-color" content="#7c3aed" />

    <!-- Íconos -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />

    <!-- Open Graph (vista previa en WhatsApp, Facebook, LinkedIn, Slack…) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Rompecoco" />
    <meta property="og:locale" content="es_ES" />
    <meta property="og:url" content="%VITE_SITE_URL%/" />
    <meta property="og:title" content="Rompecoco · Juegos para romperte el coco" />
    <meta
      property="og:description"
      content="Acertijos, palabras y patrones. Partidas cortas y un reto nuevo cada día."
    />
    <meta property="og:image" content="%VITE_SITE_URL%/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Rompecoco: juegos para romperte el coco" />

    <!-- Twitter / X -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Rompecoco · Juegos para romperte el coco" />
    <meta
      name="twitter:description"
      content="Acertijos, palabras y patrones. Partidas cortas y un reto nuevo cada día."
    />
    <meta name="twitter:image" content="%VITE_SITE_URL%/og-image.png" />

    <script>
      // Aplica el tema antes de pintar para evitar parpadeo (ver src/hooks/use-theme.ts)
      try {
        var t = localStorage.getItem("rompecoco-theme");
        if (t === "dark" || (!t && matchMedia("(prefers-color-scheme: dark)").matches)) {
          document.documentElement.classList.add("dark");
        }
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>Rompecoco necesita JavaScript para funcionar.</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
